    # Laravel API Resource pagination - top-level links object
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
          nullable: true
          description: URL to first page
        last:
          type: string
          format: uri
          nullable: true
          description: URL to last page
        prev:
          type: string
          format: uri
          nullable: true
          description: URL to previous page (null on first page)
        next:
          type: string
          format: uri
          nullable: true
          description: URL to next page (null on last page)

    # Laravel API Resource pagination - meta.links array item
    PaginationMetaLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          nullable: true
        label:
          type: string
          description: Page number or navigation label (e.g., "&laquo; Previous")
        active:
          type: boolean
          description: Whether this is the current page

    # Laravel API Resource pagination - meta object
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
          description: First item number on current page (null if empty)
        last_page:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationMetaLink'
          description: Array of page links for navigation UI
        path:
          type: string
          format: uri
          description: Base path for pagination URLs
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
          description: Last item number on current page (null if empty)
        total:
          type: integer

